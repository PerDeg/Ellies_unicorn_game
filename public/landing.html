<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ellie fyller 4 år! 🦄</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: linear-gradient(155deg, #c026d3 0%, #a855f7 38%, #7c3aed 65%, #db2777 100%);
  font-family: 'Nunito', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* ── Fixed background layers ──────────────────────────────── */
#stars, #glitter-wrap {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
#glitter-wrap { z-index: 1; }

/* Stars */
.star {
  position: absolute;
  animation: twinkle ease-in-out infinite;
  opacity: 0.7;
  user-select: none;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50%       { opacity: 1;   transform: scale(1.3); }
}

/* Glitter particles */
.glitter {
  position: absolute;
  border-radius: 50%;
  animation: glitterFall linear forwards;
  opacity: 0.9;
}
@keyframes glitterFall {
  0%   { transform: translateY(0) rotate(0deg)   scale(1);   opacity: 0.9; }
  80%  { opacity: 0.8; }
  100% { transform: translateY(105vh) rotate(720deg) scale(0.4); opacity: 0; }
}

/* ── Page ─────────────────────────────────────────────────── */
.page {
  position: relative; z-index: 2;
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 16px 52px;
}

/* ── Rainbow bar ──────────────────────────────────────────── */
.rainbow-bar {
  height: 8px;
  border-radius: 99px;
  background: linear-gradient(90deg,
    #ff0000, #ff8c00, #ffe500, #00c800, #0090ff, #8b00ff, #ff0090, #ff0000);
  background-size: 200% auto;
  animation: rainbowScroll 3s linear infinite;
  margin-bottom: 18px;
  box-shadow: 0 0 12px rgba(255,255,255,0.4);
}
@keyframes rainbowScroll {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}

/* ── Hero ─────────────────────────────────────────────────── */
.hero { text-align: center; padding: 4px 0 16px; }

.hero-uni {
  font-size: 82px;
  line-height: 1;
  display: block;
  margin-bottom: 8px;
  animation: uniFloat 2.8s ease-in-out infinite;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,0.3));
}
@keyframes uniFloat {
  0%, 100% { transform: translateY(0)   rotate(-3deg); }
  50%       { transform: translateY(-14px) rotate(3deg); }
}

.hb-text {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2em, 9vw, 3em);
  line-height: 1.1;
  background: linear-gradient(90deg,
    #fff 0%, #ffe066 20%, #ffb3e6 40%, #b3f0ff 60%, #ffe066 80%, #fff 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3.5s linear infinite;
  filter: drop-shadow(0 2px 12px rgba(255,255,255,0.5));
}
@keyframes shimmer {
  0%   { background-position: 0%   center; }
  100% { background-position: 200% center; }
}

.hero-name {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.6em, 7vw, 2.2em);
  color: #fff;
  text-shadow: 0 2px 18px rgba(0,0,0,0.3), 0 0 40px rgba(255,200,255,0.5);
  margin-top: 2px;
}

.hero-sub {
  font-size: 1.05em;
  font-weight: 700;
  margin-top: 8px;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 8px rgba(0,0,0,0.2);
}

/* Rainbow arc under hero */
.rainbow-arc {
  display: flex;
  gap: 3px;
  justify-content: center;
  margin: 12px 0 4px;
}
.arc-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  animation: arcPop 1.4s ease-in-out infinite;
}
.arc-dot:nth-child(1)  { background:#ff4d4d; animation-delay:0s;    }
.arc-dot:nth-child(2)  { background:#ff9900; animation-delay:0.1s;  }
.arc-dot:nth-child(3)  { background:#ffe600; animation-delay:0.2s;  }
.arc-dot:nth-child(4)  { background:#33cc33; animation-delay:0.3s;  }
.arc-dot:nth-child(5)  { background:#00aaff; animation-delay:0.4s;  }
.arc-dot:nth-child(6)  { background:#9933ff; animation-delay:0.5s;  }
.arc-dot:nth-child(7)  { background:#ff33cc; animation-delay:0.6s;  }
.arc-dot:nth-child(8)  { background:#ff4d4d; animation-delay:0.7s;  }
.arc-dot:nth-child(9)  { background:#ff9900; animation-delay:0.8s;  }
.arc-dot:nth-child(10) { background:#ffe600; animation-delay:0.9s;  }
.arc-dot:nth-child(11) { background:#33cc33; animation-delay:1.0s;  }
.arc-dot:nth-child(12) { background:#00aaff; animation-delay:1.1s;  }
.arc-dot:nth-child(13) { background:#9933ff; animation-delay:1.2s;  }
.arc-dot:nth-child(14) { background:#ff33cc; animation-delay:1.3s;  }
@keyframes arcPop {
  0%, 100% { transform: scaleY(0.7); opacity: 0.6; }
  50%       { transform: scaleY(1.4); opacity: 1;   }
}

/* ── Cards ────────────────────────────────────────────────── */
.card {
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255,255,255,0.30);
  border-radius: 24px;
  padding: 20px 18px;
  margin-bottom: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.14);
}
.card h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.35em;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

/* ── Info rows ────────────────────────────────────────────── */
.info-row {
  display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 12px;
}
.info-row:last-child { margin-bottom: 0; }
.info-icon { font-size: 1.35em; flex-shrink: 0; margin-top: 1px; }
.info-text { line-height: 1.45; font-weight: 700; font-size: 1.02em; }
.info-text .lbl { display: block; font-size: 0.78em; font-weight: 400; opacity: 0.7; margin-bottom: 1px; }

/* ── Form ─────────────────────────────────────────────────── */
.field { margin-bottom: 14px; }
.field:last-of-type { margin-bottom: 0; }
.field label { display: block; font-weight: 700; font-size: 0.95em; margin-bottom: 6px; }
.req { color: #fde68a; }

input[type="text"], textarea {
  width: 100%;
  background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.36);
  border-radius: 13px;
  padding: 12px 14px;
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 1em; font-weight: 700;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  -webkit-appearance: none;
}
input[type="text"]::placeholder, textarea::placeholder { color: rgba(255,255,255,0.48); font-weight: 400; }
input[type="text"]:focus, textarea:focus {
  border-color: rgba(255,255,255,0.75);
  background: rgba(255,255,255,0.26);
}
input[type="text"].error { border-color: #fca5a5; }
textarea { min-height: 88px; resize: vertical; }

.field-err { font-size: 0.82em; color: #fde68a; margin-top: 5px; display: none; }
.field-err.show { display: block; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn-submit {
  width: 100%; margin-top: 16px;
  background: linear-gradient(135deg, #f472b6, #e879f9);
  border: none; border-radius: 16px; padding: 15px 16px;
  font-family: 'Fredoka One', cursive; font-size: 1.25em;
  color: #fff; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  transition: transform 0.12s, opacity 0.2s;
  letter-spacing: 0.02em;
}
.btn-submit:active   { transform: scale(0.97); }
.btn-submit:disabled { opacity: 0.55; cursor: default; transform: none; }

.form-status {
  margin-top: 12px; text-align: center; font-weight: 700;
  font-size: 0.95em; border-radius: 12px; padding: 10px 12px;
  display: none; line-height: 1.45;
}
.form-status.ok  { display:block; background:rgba(134,239,172,0.2); color:#bbf7d0; border:1px solid rgba(134,239,172,0.35); }
.form-status.err { display:block; background:rgba(252,165,165,0.18); color:#fca5a5; border:1px solid rgba(252,165,165,0.35); }

/* ── Play button ──────────────────────────────────────────── */
.btn-play {
  display: block; width: 100%;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  border: none; border-radius: 22px; padding: 20px 16px;
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.2em, 5vw, 1.5em);
  color: #fff; text-decoration: none; text-align: center; cursor: pointer;
  box-shadow: 0 4px 28px rgba(0,0,0,0.28), 0 0 0 3px rgba(255,255,255,0.18);
  transition: transform 0.12s;
  letter-spacing: 0.02em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.22);
  animation: playPulse 2.5s ease-in-out infinite;
}
.btn-play:active { transform: scale(0.97); }
@keyframes playPulse {
  0%,100% { box-shadow: 0 4px 28px rgba(0,0,0,0.28), 0 0 0 3px rgba(255,255,255,0.18); }
  50%      { box-shadow: 0 6px 36px rgba(0,0,0,0.32), 0 0 0 8px rgba(255,255,255,0.32); }
}

/* ── Footer ───────────────────────────────────────────────── */
.footer { text-align: center; margin-top: 28px; font-size: 0.85em; opacity: 0.5; }
</style>
</head>
<body>

<div id="stars"></div>
<div id="glitter-wrap"></div>

<div class="page">

  <!-- Rainbow top bar -->
  <div class="rainbow-bar"></div>

  <!-- Hero -->
  <div class="hero">
    <span class="hero-uni">🦄</span>
    <div class="hb-text">Happy Birthday!</div>
    <div class="hero-name">Ellie fyller 4 år! 🎂</div>
    <p class="hero-sub">✨ Du är inbjuden till kalas! 🎉</p>
    <div class="rainbow-arc">
      <div class="arc-dot"></div><div class="arc-dot"></div><div class="arc-dot"></div>
      <div class="arc-dot"></div><div class="arc-dot"></div><div class="arc-dot"></div>
      <div class="arc-dot"></div><div class="arc-dot"></div><div class="arc-dot"></div>
      <div class="arc-dot"></div><div class="arc-dot"></div><div class="arc-dot"></div>
      <div class="arc-dot"></div><div class="arc-dot"></div>
    </div>
  </div>

  <!-- Party info -->
  <div class="card">
    <h2>🎈 Kalasinformation</h2>

    <div class="info-row">
      <span class="info-icon">📅</span>
      <div class="info-text">
        <span class="lbl">Datum</span>
        Söndag 26 april 2026
      </div>
    </div>

    <div class="info-row">
      <span class="info-icon">⏰</span>
      <div class="info-text">
        <span class="lbl">Tid</span>
        13:30 – 15:00
      </div>
    </div>

    <div class="info-row">
      <span class="info-icon">📍</span>
      <div class="info-text">
        <span class="lbl">Plats</span>
        Rönnbyskolans gymnastiksal
      </div>
    </div>

    <div class="info-row">
      <span class="info-icon">🗓️</span>
      <div class="info-text">
        <span class="lbl">OSA senast</span>
        22 april 2026
      </div>
    </div>
  </div>

  <!-- RSVP -->
  <div class="card">
    <h2>✉️ OSA</h2>
    <form id="rsvp-form" novalidate>

      <div class="field">
        <label for="rsvp-name">Ditt namn <span class="req">*</span></label>
        <input type="text" id="rsvp-name" name="name" maxlength="50"
               placeholder="Skriv ditt namn..." autocomplete="name">
        <div class="field-err" id="name-err">Vänligen ange ditt namn.</div>
      </div>

      <div class="field">
        <label for="rsvp-info">Allergier eller annan information:</label>
        <textarea id="rsvp-info" name="info" maxlength="500"
                  placeholder="T.ex. glutenintolerans, nötallergi… (valfritt)"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="rsvp-btn">Jag kommer! 🎉</button>
      <div class="form-status" id="form-status"></div>
    </form>
  </div>

  <!-- Play game -->
  <a href="/index.html" class="btn-play">🦄 Spela Ellies Enhörningsspel! ✨</a>

  <div class="footer">Med kärlek till Ellie 💖</div>

</div><!-- .page -->

<script>
// ── Background stars ─────────────────────────────────────────────────────────
(function () {
  const wrap = document.getElementById("stars");
  const syms = ["⭐","✨","🌟","💫","⭐","✨","🌟","💫"];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("div");
    el.className = "star";
    el.textContent = syms[i % syms.length];
    el.style.cssText = [
      "left:"   + (Math.random() * 98) + "vw",
      "top:"    + (Math.random() * 98) + "vh",
      "font-size:" + (0.6 + Math.random() * 1.1) + "em",
      "animation-delay:"    + (Math.random() * 5)   + "s",
      "animation-duration:" + (2 + Math.random() * 3) + "s",
    ].join(";");
    wrap.appendChild(el);
  }
})();

// ── Falling glitter ──────────────────────────────────────────────────────────
(function () {
  const wrap   = document.getElementById("glitter-wrap");
  const colors = [
    "#ff69b4","#ff85c2","#ffd700","#ffe066",
    "#bf80ff","#e066ff","#66d9ff","#80ffcc",
    "#ffffff","#ffb3de","#ff6699"
  ];

  function spawn() {
    const el = document.createElement("div");
    el.className = "glitter";
    const size = 3 + Math.random() * 6;
    const dur  = 3.5 + Math.random() * 4;
    el.style.cssText = [
      "left:"             + (Math.random() * 100) + "vw",
      "top:-10px",
      "width:"            + size + "px",
      "height:"           + size + "px",
      "background:"       + colors[Math.floor(Math.random() * colors.length)],
      "animation-duration:" + dur + "s",
    ].join(";");
    wrap.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 200);
  }

  // Stagger initial burst
  for (let i = 0; i < 20; i++) setTimeout(spawn, i * 80);
  // Continuous rain
  setInterval(spawn, 200);
})();

// ── RSVP form ────────────────────────────────────────────────────────────────
document.getElementById("rsvp-form").addEventListener("submit", async function (e) {
  e.preventDefault();

  const nameEl   = document.getElementById("rsvp-name");
  const infoEl   = document.getElementById("rsvp-info");
  const nameErr  = document.getElementById("name-err");
  const statusEl = document.getElementById("form-status");
  const btn      = document.getElementById("rsvp-btn");

  nameErr.classList.remove("show");
  nameEl.classList.remove("error");
  statusEl.className = "form-status";
  statusEl.textContent = "";

  const name = nameEl.value.trim();
  if (!name) {
    nameErr.classList.add("show");
    nameEl.classList.add("error");
    nameEl.focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = "Skickar...";

  try {
    const res  = await fetch("/api/rsvp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, info: infoEl.value.trim() }),
    });
    const data = await res.json();

    if (res.ok && data.ok) {
      statusEl.className   = "form-status ok";
      statusEl.textContent = "🎉 Tack " + name + "! Vi ses på kalaset! 🦄";
      this.reset();
      btn.textContent = "✓ Skickat!";
      setTimeout(() => { btn.disabled = false; btn.textContent = "Jag kommer! 🎉"; }, 6000);
    } else {
      throw new Error(data.error || "Okänt fel");
    }
  } catch (err) {
    statusEl.className   = "form-status err";
    statusEl.textContent = "😢 Kunde inte skicka: " + err.message + " — försök igen!";
    btn.disabled    = false;
    btn.textContent = "Jag kommer! 🎉";
  }
});
</script>
</body>
</html>
