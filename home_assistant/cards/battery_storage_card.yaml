type: custom:mushroom-template-card
primary: Solax Batteri
secondary: >-
  {% set soc = states('sensor.solax_srjle7mud9_battery_remaining_capacity') | int %}
  {% set energy = states('sensor.solax_srjle7mud9_battery_remaining_energy') %}
  {% set power = states('sensor.solax_srjle7mud9_battery_power') | float %}
  {% set kw = (power / 1000) | round(1) %}
  {{ soc }}% · {{ energy }} kWh
  {%- if power > 50 %} · Lader {{ kw }} kW
  {%- elif power < -50 %} · Urladdar {{ kw | abs }} kW
  {%- else %} · Vilande
  {%- endif %}
icon: |-
  {% set soc = states('sensor.solax_srjle7mud9_battery_remaining_capacity') | int %}
  {% set power = states('sensor.solax_srjle7mud9_battery_power') | float %}
  {% if power > 50 %}
    mdi:battery-charging
  {% elif soc >= 90 %}
    mdi:battery
  {% elif soc >= 70 %}
    mdi:battery-80
  {% elif soc >= 50 %}
    mdi:battery-60
  {% elif soc >= 30 %}
    mdi:battery-40
  {% elif soc >= 15 %}
    mdi:battery-20
  {% else %}
    mdi:battery-alert
  {% endif %}
badge_icon: |-
  {% set power = states('sensor.solax_srjle7mud9_battery_power') | float %}
  {% if power > 50 %}
    mdi:arrow-up-circle
  {% elif power < -50 %}
    mdi:arrow-down-circle
  {% endif %}
badge_color: |-
  {% set power = states('sensor.solax_srjle7mud9_battery_power') | float %}
  {% if power > 50 %}
    blue
  {% elif power < -50 %}
    orange
  {% endif %}
color: |-
  {% set soc = states('sensor.solax_srjle7mud9_battery_remaining_capacity') | int %}
  {% set power = states('sensor.solax_srjle7mud9_battery_power') | float %}
  {% if power > 50 %}
    blue
  {% elif soc >= 50 %}
    green
  {% elif soc >= 20 %}
    orange
  {% else %}
    red
  {% endif %}
tap_action:
  action: navigate
  navigation_path: /lovelace/batteri
grid_options:
  columns: 12
  rows: 1
card_mod:
  style: |
    ha-card {
      --ha-card-background: var(--card-background-color);
    }
