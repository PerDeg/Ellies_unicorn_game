# ── Ellies Unicorn Game — full stack ──────────────────────────────────────────
# Usage on Unraid (with the "Compose Manager" plugin):
#   1. Clone this repo to /mnt/user/appdata/unicorn-game/
#   2. Edit POSTGRES_PASSWORD below
#   3. Start the stack
#   4. Open http://<unraid-ip>:3000
#
# Usage locally:
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: unicorn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       unicorn_game
      POSTGRES_USER:     unicorn
      POSTGRES_PASSWORD: change_me_please
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # No ports exposed — only the game container talks to it over the internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicorn -d unicorn_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  game:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: unicorn-game
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://unicorn:change_me_please@db:5432/unicorn_game
      PORT: 3000
    ports:
      - "3000:3000"
